<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fabio Fiorita App Portfolio Mark</title>
  <desc id="desc">A rounded app icon with a stylized F and portfolio color accents.</desc>
  <defs>
    <linearGradient id="portfolio-bg" x1="84" y1="58" x2="430" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D1D21"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="portfolio-ring" x1="54" y1="58" x2="458" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5856D7"/>
      <stop offset="0.42" stop-color="#59ADC4"/>
      <stop offset="0.72" stop-color="#04C7BE"/>
      <stop offset="1" stop-color="#065808"/>
    </linearGradient>
    <filter id="portfolio-shadow" x="104" y="96" width="286" height="322" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#050506"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#portfolio-bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="98" stroke="url(#portfolio-ring)" stroke-width="14"/>

  <g filter="url(#portfolio-shadow)">
    <rect x="148" y="122" width="72" height="268" rx="36" fill="#F7F7F7"/>
    <rect x="148" y="122" width="224" height="72" rx="36" fill="#F7F7F7"/>
    <rect x="148" y="236" width="166" height="66" rx="33" fill="#F7F7F7"/>
  </g>
</svg>
